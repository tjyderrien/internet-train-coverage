<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train Internet</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc;
  --good: #2e8b57; --mid: #d99a1e; --bad: #c8412f; --none: #cfccc5; --accent: #1f5fbf;
  --accent-text: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --card: #22211f; --text: #ecebe7; --muted: #a09e98; --line: #34332f;
    --good: #4fb37b; --mid: #e3ac3d; --bad: #e0634f; --none: #45433f; --accent: #6b9ef0;
    --accent-text: #0e0e0d;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --card: #22211f; --text: #ecebe7; --muted: #a09e98; --line: #34332f;
  --good: #4fb37b; --mid: #e3ac3d; --bad: #e0634f; --none: #45433f; --accent: #6b9ef0;
  --accent-text: #0e0e0d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 1.5rem; margin: 0 0 2px; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px; margin-bottom: 16px; }
button { font: inherit; border: 0; border-radius: 10px; cursor: pointer; }
.big { width: 100%; padding: 16px; font-size: 1.15rem; font-weight: 600;
  background: var(--accent); color: var(--accent-text); }
.big.stop { background: var(--bad); color: #fff; }
.link { background: none; color: var(--accent); padding: 0; }
input, select { font: inherit; width: 100%; padding: 10px 12px; margin: 4px 0 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
label { font-size: .9rem; color: var(--muted); }
details { margin-bottom: 12px; color: var(--muted); font-size: .9rem; }
.hint { color: var(--muted); font-size: .85rem; margin: 10px 0 0; }
.state { display: flex; align-items: center; gap: 12px; font-size: 1.4rem; font-weight: 650;
  margin-bottom: 14px; }
.dot { width: 22px; height: 22px; border-radius: 50%; background: var(--none); flex: none; }
.dot.good { background: var(--good); } .dot.bad { background: var(--bad); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;
  margin-bottom: 14px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tile .k { font-size: .8rem; color: var(--muted); }
.tile .v { font-size: 1.25rem; font-weight: 600; }
.tile .w { font-size: .8rem; color: var(--muted); }
.trip { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
  padding: 12px 4px; background: none; color: var(--text); text-align: left;
  border-bottom: 1px solid var(--line); border-radius: 0; }
.trip:last-child { border-bottom: 0; }
.trip .d { color: var(--muted); font-size: .85rem; }
.pct { font-weight: 650; white-space: nowrap; }
.chart { width: 100%; height: auto; display: block; margin: 4px 0 6px; }
.chart text { fill: var(--muted); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted);
  margin-bottom: 14px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
  margin-right: 5px; vertical-align: -1px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
.empty { color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Train internet</h1>
  <p class="sub">Records how well the internet works during a trip, using very little data.</p>

  <!-- recorder -->
  <section class="card" id="idle" hidden>
    <h2>New trip</h2>
    <label for="label">Name (optional)</label>
    <input id="label" placeholder="e.g. Praha → Brno">
    <details>
      <summary>Options</summary>
      <label for="portal">Read the position from the train's Wi-Fi portal (laptop only)</label>
      <select id="portal"><option value="">No</option></select>
    </details>
    <button class="big" id="start">Start recording</button>
    <p class="hint" id="idleHint">Uses about 5 MB per hour. You can close this page: recording continues
      until you press Stop.</p>
  </section>

  <section class="card" id="live" hidden>
    <div class="state"><span class="dot" id="dot"></span><span id="stateText">Checking…</span></div>
    <div class="tiles" id="liveTiles"></div>
    <button class="big stop" id="stop">Stop recording</button>
    <p class="hint" id="liveHint"></p>
  </section>

  <!-- trip detail -->
  <section class="card" id="detail" hidden>
    <button class="link" id="back">← All trips</button>
    <h2 id="dTitle" style="margin-top:10px"></h2>
    <p class="sub" id="dDate"></p>
    <div class="tiles" id="dTiles"></div>
    <div id="dAlong"></div>
    <div id="dTime"></div>
    <div id="dOut"></div>
  </section>

  <!-- trips -->
  <section class="card" id="trips">
    <h2>Trips</h2>
    <div id="tripList"><p class="empty">No trips yet.</p></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const api = (p, body) => fetch(p, body === undefined ? {} :
  { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) })
  .then(r => r.json());

const fmtDur = s => {
  if (s == null) return "–";
  s = Math.round(s);
  if (s < 60) return s + " s";
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} h ${String(m).padStart(2, "0")} min` : `${m} min ${s % 60 ? (s % 60) + " s" : ""}`;
};
const fmtSpeed = k => k == null ? "–" : k >= 1000 ? (k / 1000).toFixed(1) + " Mbit/s" : Math.round(k) + " kbit/s";
const fmtDate = t => new Date(t * 1000).toLocaleString([], {dateStyle: "medium", timeStyle: "short"});
const fmtTime = t => new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const wifiWord = d => d == null ? "" : d >= -60 ? "strong" : d >= -70 ? "good" : d >= -80 ? "weak" : "very weak";
const cellWord = d => d == null ? "" : d >= -90 ? "strong" : d >= -105 ? "fair" : "weak";
const tile = (k, v, w = "") => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="w">${w}</div></div>`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

// ---------------------------------------------------------------- recording
let portalsFilled = false;
async function refresh() {
  let s;
  try { s = await api("/api/status"); } catch { return; }
  if (!portalsFilled) {
    $("portal").innerHTML += s.portals.map(p => `<option value="${p}">${{cd: "České dráhy", ice: "DB ICE", oebb: "ÖBB Railjet"}[p] || p}</option>`).join("");
    portalsFilled = true;
    if (s.android) $("portal").closest("details").hidden = true;
  }
  $("idle").hidden = s.recording;
  $("live").hidden = !s.recording;
  if (!s.recording) return;
  const dot = $("dot");
  dot.className = "dot " + (s.online == null ? "" : s.online ? "good" : "bad");
  $("stateText").textContent = s.online == null ? "Checking…" : s.online ? "Internet works" : "No internet";
  let t = tile("Response time", s.rtt_ms == null ? "–" : Math.round(s.rtt_ms) + " ms", "lower is better")
        + tile("Download test", fmtSpeed(s.download_kbps), "every 2 minutes")
        + tile("Wi-Fi signal", s.wifi_dbm == null ? "–" : s.wifi_dbm + " dBm", wifiWord(s.wifi_dbm));
  if (s.android) t += tile("Phone signal", s.cell_dbm == null ? "–" : s.cell_dbm + " dBm", cellWord(s.cell_dbm));
  t += tile("Speed", s.speed_kmh == null ? "–" : s.speed_kmh + " km/h",
            s.has_position ? "position OK" : "no position yet")
     + tile("Recording for", fmtDur(s.elapsed_s), esc(s.label));
  $("liveTiles").innerHTML = t;
  $("liveHint").textContent = `Data used in the last hour: ${s.data_mb_last_hour} MB.`
    + (s.has_position ? "" : s.android ? " Waiting for GPS: keep the phone near a window."
       : " Without a position, results are shown over time only.");
}
$("start").onclick = async () => {
  $("start").disabled = true;
  await api("/api/start", {label: $("label").value.trim(), portal: $("portal").value});
  $("label").value = ""; $("start").disabled = false;
  refresh(); loadTrips();
};
$("stop").onclick = async () => {
  $("stop").disabled = true; $("stop").textContent = "Stopping…";
  const r = await api("/api/stop", {});
  $("stop").disabled = false; $("stop").textContent = "Stop recording";
  await refresh(); await loadTrips();
  if (r.trip_id) openTrip(r.trip_id);
};

// ---------------------------------------------------------------- trips
async function loadTrips() {
  const trips = await api("/api/trips");
  $("tripList").innerHTML = trips.length ? trips.map(t => `
    <button class="trip" data-id="${t.id}">
      <span><b>${esc(t.label) || "Trip " + t.id}</b><br>
        <span class="d">${fmtDate(t.started)}${t.ended ? " · " + fmtDur(t.ended - t.started) : " · recording"}</span></span>
      <span class="pct" style="color:${colorFor(t.online_pct == null ? null : t.online_pct / 100)}">
        ${t.online_pct == null ? "–" : t.online_pct + "% online"}</span>
    </button>`).join("") : `<p class="empty">No trips yet. Press Start when the train leaves.</p>`;
  document.querySelectorAll(".trip").forEach(b => b.onclick = () => openTrip(+b.dataset.id));
}

function colorFor(f) {
  const v = n => getComputedStyle(document.documentElement).getPropertyValue(n);
  return f == null ? v("--none") : f >= 0.95 ? v("--good") : f >= 0.5 ? v("--mid") : v("--bad");
}

// A strip coloured by "online" plus a response-time line, against km or time.
function chart(buckets, x0, x1, xmin, xmax, tick) {
  const W = innerWidth < 520 ? 340 : 600, H = 150, L = 34, R = 8, top = 6, stripH = 22, gap = 14, lineH = 80;
  const X = v => L + (v - xmin) / (xmax - xmin || 1) * (W - L - R);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" shape-rendering="crispEdges">`;
  for (const b of buckets)
    s += `<rect x="${X(x0(b))}" y="${top}" width="${Math.max(X(x1(b)) - X(x0(b)) + 0.6, 1)}" height="${stripH}" fill="${colorFor(b.online)}"/>`;
  const rtts = buckets.map(b => b.rtt_ms).filter(v => v != null).sort((a, b) => a - b);
  const ymax = rtts.length ? Math.max(50, rtts[Math.floor(rtts.length * 0.95)] * 1.1) : 100;
  const y0 = top + stripH + gap, Y = v => y0 + lineH - Math.min(v, ymax) / ymax * lineH;
  let path = "", pen = false;
  for (const b of buckets) {
    if (b.rtt_ms == null) { pen = false; continue; }
    const x = (X(x0(b)) + X(x1(b))) / 2;
    path += (pen ? "L" : "M") + x.toFixed(1) + " " + Y(b.rtt_ms).toFixed(1); pen = true;
  }
  s += `<line x1="${L}" x2="${W - R}" y1="${y0 + lineH}" y2="${y0 + lineH}" stroke="var(--line)"/>`;
  s += `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.8" shape-rendering="auto"/>`;
  s += `<text x="${L - 4}" y="${top + 15}" text-anchor="end">net</text>`;
  s += `<text x="${L - 4}" y="${y0 + 8}" text-anchor="end">${Math.round(ymax)}</text>`;
  s += `<text x="${L - 4}" y="${y0 + lineH}" text-anchor="end">0 ms</text>`;
  for (let i = 0; i <= 4; i++) {
    const v = xmin + (xmax - xmin) * i / 4;
    s += `<text x="${X(v)}" y="${H - 4}" text-anchor="${i === 0 ? "start" : i === 4 ? "end" : "middle"}">${tick(v)}</text>`;
  }
  return s + "</svg>";
}
const legend = `<div class="legend"><span><i style="background:var(--good)"></i>online</span>
  <span><i style="background:var(--mid)"></i>patchy</span><span><i style="background:var(--bad)"></i>no internet</span>
  <span><i style="background:var(--none)"></i>no data</span><span><i style="background:var(--accent)"></i>response time</span></div>`;

async function openTrip(id) {
  const d = await api(`/api/trips/${id}`);
  if (d.error) return;
  const s = d.summary;
  $("dTitle").textContent = d.trip.label || "Trip " + id;
  $("dDate").textContent = fmtDate(d.trip.started) + (d.trip.ended ? "" : " · still recording");
  $("dTiles").innerHTML =
      tile("Internet available", s.online_pct == null ? "–" : s.online_pct + "%", "of the time")
    + tile("Outages", s.outages, "longest " + fmtDur(s.longest_outage_s))
    + tile("Typical response", s.rtt_ms_median == null ? "–" : Math.round(s.rtt_ms_median) + " ms", "median")
    + tile("Typical download", fmtSpeed(s.download_kbps_median), "small test, lower bound")
    + tile("Duration", fmtDur(s.duration_s), s.distance_km == null ? "no position" : s.distance_km + " km")
    + tile("Data used", s.data_used_mb + " MB", "by the tests");
  if (d.along && d.along.buckets.length) {
    const b = d.along.buckets, max = b[b.length - 1].km1;
    $("dAlong").innerHTML = `<h2>Along the trip</h2>` + legend
      + chart(b, x => x.km0, x => x.km1, 0, max, v => v.toFixed(max < 10 ? 1 : 0) + " km");
  } else {
    $("dAlong").innerHTML = `<p class="hint">No position was recorded, so there is no map along the
      kilometres. Use the phone (GPS) or the train portal option next time.</p>`;
  }
  const tb = d.timeline.buckets, st = d.timeline.step_s;
  $("dTime").innerHTML = tb.length ? `<h2 style="margin-top:18px">Over time</h2>` + (d.along ? "" : legend)
    + chart(tb, x => x.t, x => x.t + st, d.trip.started, tb[tb.length - 1].t + st, fmtTime) : "";
  $("dOut").innerHTML = d.outages.length ? `<h2 style="margin-top:18px">Outages</h2><table>
    <tr><th>When</th><th>How long</th><th>Where</th></tr>` + d.outages.map(o =>
      `<tr><td>${fmtTime(o.start)}</td><td>${fmtDur(o.duration_s)}</td><td>${o.km == null ? "–" : "km " + o.km}</td></tr>`).join("")
    + "</table>" : `<p class="hint">No outages longer than a few seconds.</p>`;
  $("detail").hidden = false; $("trips").hidden = true;
  history.replaceState(null, "", "#trip=" + id);
  window.scrollTo(0, 0);
}
$("back").onclick = () => {
  $("detail").hidden = true; $("trips").hidden = false; history.replaceState(null, "", "#");
};

refresh(); loadTrips();
const m = location.hash.match(/trip=(\d+)/);
if (m) openTrip(+m[1]);
setInterval(refresh, 2000);
</script>
</body>
</html>
