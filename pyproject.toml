[project]
name = "trainnet"
version = "0.1.0"
description = "Wi-Fi and internet quality along train trips, as a 1D map"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "fastapi",
    "uvicorn",
    "pyobjc-framework-CoreWLAN; sys_platform == 'darwin'",
]

[project.scripts]
trainnet = "trainnet.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trainnet"]
